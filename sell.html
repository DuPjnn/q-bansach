<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng bán – Tiệm Sách Cũ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head><body><div id="nav"></div>
<main class="container" style="max-width:720px"><h1 class="page-title">Đăng bán sách<small>Bài đăng sẽ hiển thị sau khi quản trị viên duyệt</small></h1>
<form id="sellForm" class="paper-box row g-3">
 <div class="col-md-8"><label class="form-label" for="title">Tên sách</label><input class="form-control" id="title" name="title" required></div>
 <div class="col-md-4"><label class="form-label" for="author">Tác giả</label><input class="form-control" id="author" name="author" required></div>
 <div class="col-md-4"><label class="form-label" for="category">Thể loại</label><select class="form-select" id="category" name="category">
   <option>Văn học</option><option>Kinh tế</option><option>Kỹ năng sống</option><option>Khoa học</option><option>Giáo trình</option><option>Thiếu nhi</option><option>Khác</option></select></div>
 <div class="col-md-4"><label class="form-label" for="type">Loại sách</label><select class="form-select" id="type" name="type"><option value="used">Sách cũ</option><option value="new">Sách mới</option></select></div>
 <div class="col-md-4"><label class="form-label" for="price">Giá bán (₫)</label><input class="form-control" type="number" min="0" step="1000" id="price" name="price" required></div>
 <div class="col-md-4"><label class="form-label" for="condition">Độ mới (%)</label><input class="form-control" type="number" min="1" max="100" id="condition" name="condition" value="85" required></div>
 <div class="col-md-8"><label class="form-label" for="cover">Link ảnh bìa</label><input class="form-control" type="url" id="cover" name="cover" placeholder="https://…" required></div>
 <div class="col-md-6"><label class="form-label" for="seller">Tên người bán</label><input class="form-control" id="seller" name="seller" required></div>
 <div class="col-md-6"><label class="form-label" for="contact">Số điện thoại hoặc Zalo</label><input class="form-control" id="contact" name="contact" required></div>
 <div class="col-12"><label class="form-label" for="description">Mô tả ngắn</label><textarea class="form-control" id="description" name="description" rows="3"></textarea></div>
 <div class="col-12"><button class="btn btn-vintage w-100" type="submit">Gửi bài đăng</button><div id="sellMsg" class="mt-3"></div></div>
</form></main>
<footer>Tiệm Sách Cũ · Sàn giao dịch sách cũ và mới giữa người với người</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script><script>initSell()</script></body></html>
